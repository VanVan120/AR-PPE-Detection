# =============================================================================
# Phase 2 — Real-Time Video & Tracking — configuration
#
# Every knob lives here. The violation_rules class names MUST match the trained
# detector's own class names exactly. This model (best_refined.pt, trained on the
# PPE dataset) exposes 5 classes:
#     Helmet, No-Helmet, No-Vest, Person, Vest
# so the safety-critical *violation* classes are `No-Helmet` and `No-Vest`.
# (The model has no mask class, so there is no "No-Mask" rule.)
# Run `python run.py --check` to verify every rule name resolves against the model.
# =============================================================================

weights: "models/best.pt"       # trained detector (copied from Phase 1 best_refined.pt)
source: 0                       # 0 = default webcam; or a path e.g. "data/clips/walkthrough.mp4"
confidence_threshold: 0.35      # detections below this are ignored
imgsz: 640                      # inference resolution (multiple of 32). Lower (480/320)
                                # trades accuracy for FPS — useful on CPU.
device: "auto"                  # auto | cpu | cuda | mps

# The class the detector uses for a person. Violations are attributed to the
# tracked person they belong to, so this must match the model's person class.
person_class: "Person"

# Which classes are violations, how severe, and the human-readable HUD label.
# Names match the model's class names exactly (see header).
violation_rules:
  "No-Helmet": {severity: "high",   label: "No hard hat"}
  "No-Vest":   {severity: "medium", label: "No safety vest"}

# Spatial association: a violation box (e.g. a bare head) is attributed to the
# tracked person whose box contains the largest fraction of it. This is the
# minimum overlap fraction (intersection / violation-box area) to attribute it.
association_containment: 0.30

# Temporal smoothing so alerts don't flicker on a single noisy frame.
debounce_frames: 5              # a violation must persist this many frames to FIRE
clear_frames: 15                # it CLEARS after this many frames absent/compliant

# Tracking (ByteTrack). lost_track_buffer keeps an ID alive through brief
# occlusion so the same person keeps their number when they reappear.
lost_track_buffer: 30

target_fps: 15                  # informational target; also seeds ByteTrack's frame rate
save_output_video: false        # true (or run.py --record) writes outputs/session_video.mp4

# Phase 1 clean-benchmark metrics the reality-check compares first-person footage
# against (best_refined.pt on the held-out PPE test split).
benchmark_file: "benchmark.json"

# =============================================================================
# Work ID — bind each tracked person to a persistent WORKER identity.
# Each worker wears a printed ArUco marker (helmet/vest). The reader maps the
# marker -> the tracked person that contains it -> a worker label, and the
# binding sticks even when the marker is briefly hidden. This is the "Work ID
# as the main detection object" capability.  (Generate tags with
# `python tools/make_worker_tags.py`; needs cv2.aruco / opencv-contrib-python.)
# =============================================================================
# Persistent worker identity. Keeps a worker (and their violation history) attached to
# the same person across track-id changes, occlusion and re-entry — the thing raw
# ByteTrack cannot do. The ArUco badge below stays AUTHORITATIVE; appearance only fills
# the gaps where no tag is visible. Works with no props: unbadged people become
# "Worker 1", "Worker 2", ... and keep those identities.
identity:
  enabled: true
  appearance: true               # false -> badge-only (names only where a tag is read)
  method: "histogram"            # histogram (no download) | deep (torchvision ResNet-18)
  match_threshold: 0.62          # min cosine similarity to accept a re-identification
  margin: 0.04                   # best must beat the runner-up by this, else stay unsure
  max_exemplars: 8               # appearance samples remembered per worker
  forget_after: 9000             # frames an UNBADGED worker is remembered (~5 min @30fps)
  min_box_height: 48             # ignore boxes too small to describe reliably
  report: ""                     # optional path -> per-worker JSON safety report

workid:
  enabled: false                 # set true to attribute people/violations to workers
  dictionary: "DICT_4X4_50"      # ArUco dictionary (must match the printed tags)
  containment: 0.5               # min fraction of a marker inside a person box to bind
                                 # (majority-inside; also requires the marker centre inside)
  markers:                       # marker id -> worker label
    0: "Alice Tan"
    1: "Bob Lim"
    2: "Chong Wei"

# Worker-attributed violation log (JSONL, one event per line). OPT-IN: empty/""/null
# is disabled (a plain `python run.py` then creates no file). Set a path to enable, e.g.
# "outputs/events.jsonl". Records are event-typed (session_start / violation /
# session_bindings / session_end) and feed the future AI daily safety report (Phase 3).
event_log: ""

# =============================================================================
# Activity / Dynamic-Workflow recognition — SCAFFOLD ONLY.
# Off by default and intentionally not a real recognizer yet: the model waits on
# the confirmed egocentric dataset (Assembly101 / Ego4D). The seam (per-worker
# clip buffer + recognizer interface) is wired so the trained model drops in
# later with no pipeline changes.
#   backend: placeholder  -> returns "pending-dataset" (honest no-op)
#            kinetics      -> a generic Kinetics-400 pretrained video model
#                            (torchvision); a DEMO of the seam, NOT construction steps
#            assembly101   -> a TAS model trained in phase3_activity/ (real step
#                            recognition). Set checkpoint + actions_csv below. NOTE:
#                            live inference uses a STAND-IN feature extractor unless a
#                            matching Assembly101 TSM extractor is supplied, so its
#                            correct use is offline scoring (phase3_activity/tas/evaluate.py).
# =============================================================================
# Phase 3 workflow understanding. Kept OFF here on purpose: a *live* assembly101
# backend needs a real Assembly101 TSM feature extractor, and the stand-in produces
# wiring-demo labels, not meaningful steps (see phase3_activity/tas/infer_seam.py).
# To SEE Phase 3 working, replay a step stream offline instead — no downloads needed:
#     python -m phase3_activity.tas.demo --inject-fault
activity:
  enabled: false
  backend: "placeholder"
  clip_len: 16
  stride: 2
  checkpoint: ""                 # assembly101: path to a trained TAS checkpoint (.pt)
  actions_csv: ""                # assembly101: path to Assembly101 actions.csv (id -> step)
  procedure_model: ""            # assembly101 (optional): order model JSON -> flags
                                 #   out-of-order steps (workflow_mistake events).
                                 #   Build: python -m phase3_activity.tas.procedure
  anticipation_model: ""         # assembly101 (optional): next-step model JSON -> shows
                                 #   the anticipated next step(s) in the overlay.
                                 #   Build: python -m phase3_activity.tas.anticipation
